name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nimbusmart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Lint and static-check backend
        working-directory: backend
        run: uv run python -m compileall -q app

      - name: Test backend
        working-directory: backend
        run: uv run python -m unittest discover -s . -p 'test*.py'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend when configured
        working-directory: frontend
        run: npm run lint --if-present

      - name: Test frontend when configured
        working-directory: frontend
        run: npm test --if-present

      - name: Build frontend without secrets
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy GitHub Pages
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify deployment token
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "${DEPLOYMENT_TOKEN}" ]]; then
            echo "::error::GITHUB_TOKEN is unavailable. Enable GitHub Actions and allow Pages deployments for this repository."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble architecture site
        run: |
          mkdir -p _site
          cp architecture.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5